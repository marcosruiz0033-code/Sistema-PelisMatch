<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Fragments/UsuarioLayout :: base(~{::contenidoUsuario})}">
<head>
    <meta charset="UTF-8">
    <title>Resultados de búsqueda — PeliMatch</title>
</head>
<body>
<div th:fragment="contenidoUsuario">
    <section class="search-results">
        <div class="search-results-header">
            <h1 class="seccion-titulo">Resultados de búsqueda</h1>
            <p class="catalogo-descripcion" th:if="${!consulta.isBlank()}">
                Resultados para: <strong th:text="${consulta}">consulta</strong>
            </p>
        </div>

        <div class="search-empty" th:if="${consulta.isBlank()}">
            <i class="bi bi-search"></i>
            <h2>Busca tus próximos favoritos</h2>
            <p>Escribe el nombre de una película o serie en el buscador.</p>
        </div>

        <div th:if="${!consulta.isBlank() and peliculas.isEmpty() and series.isEmpty()}"
             class="search-empty">
            <i class="bi bi-emoji-frown"></i>
            <h2>No encontramos resultados</h2>
            <p>Prueba con otro título o revisa la ortografía.</p>
        </div>

        <section class="seccion search-section" th:if="${!peliculas.isEmpty()}">
            <h2 class="seccion-titulo">Películas</h2>
            <div class="grid-tarjetas">
                <a class="tarjeta" th:each="p : ${peliculas}" th:href="@{/peliculas}">
                    <div class="poster-placeholder"><i class="bi bi-film"></i></div>
                    <div class="card-body">
                        <p class="titulo" th:text="${p.titulo}">Título</p>
                        <p class="meta">
                            <span th:text="${p.genero}">Género</span> ·
                            <span th:text="${p.anio}">2025</span>
                        </p>
                    </div>
                </a>
            </div>
        </section>

        <section class="seccion search-section" th:if="${!series.isEmpty()}">
            <h2 class="seccion-titulo">Series</h2>
            <div class="grid-tarjetas">
                <a class="tarjeta" th:each="s : ${series}" th:href="@{/series/{id}(id=${s.idSerie})}">
                    <img class="poster" th:if="${s.imagen != null and !s.imagen.isEmpty()}"
                         th:src="${s.imagen}" th:alt="${s.titulo}">
                    <div class="poster-placeholder" th:unless="${s.imagen != null and !s.imagen.isEmpty()}">
                        <i class="bi bi-tv"></i>
                    </div>
                    <div class="card-body">
                        <p class="titulo" th:text="${s.titulo}">Título</p>
                        <p class="meta">
                            <span th:text="${s.anio}">2025</span> ·
                            <span th:text="${s.categoria.nombre}">Categoría</span>
                        </p>
                    </div>
                </a>
            </div>
        </section>
    </section>
</div>
</body>
</html>
