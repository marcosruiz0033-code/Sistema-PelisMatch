<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace = "~{Fragments/AdminLayout :: base(~{::contenidoAdmin})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main th:fragment="contenidoAdmin" class="p-4 content">
    <h1 th:text="${pelicula.id == null
        ? 'Agregar película'
        : 'Editar película'}">
        Película
    </h1>

    <form th:action="@{/admin/peliculas/guardar}"
          th:object="${pelicula}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div>
            <label for="titulo">Título</label>
            <input id="titulo" type="text" th:field="*{titulo}">
            <span th:if="${#fields.hasErrors('titulo')}"
                  th:errors="*{titulo}"></span>
        </div>

        <div>
            <label for="genero">Género</label>
            <input id="genero" type="text" th:field="*{genero}">
            <span th:if="${#fields.hasErrors('genero')}"
                  th:errors="*{genero}"></span>
        </div>

        <div>
            <label for="director">Director</label>
            <input id="director" type="text" th:field="*{director}">
        </div>

        <div>
            <label for="anio">Año</label>
            <input id="anio" type="number" th:field="*{anio}">
            <span th:if="${#fields.hasErrors('anio')}"
                  th:errors="*{anio}"></span>
        </div>

        <div>
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion"
                      th:field="*{descripcion}"></textarea>
            <span th:if="${#fields.hasErrors('descripcion')}"
                  th:errors="*{descripcion}"></span>
        </div>

        <button type="submit">Guardar película</button>

        <a th:href="@{/admin/peliculas}">Cancelar</a>
    </form>
</main>
</body>
</html>
