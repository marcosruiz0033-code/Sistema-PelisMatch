<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - PelisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/CSS/StyleDash.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="auth-brand" th:href="@{/login}"><i class="bi bi-film"></i> PelisMatch</a>
    <p class="text-uppercase small fw-semibold text-secondary mt-4 mb-2">Bienvenido de nuevo</p>
    <h1 class="h3 fw-bold">Inicia sesión</h1>
    <p class="text-secondary">Ingresa a tu cuenta para continuar.</p>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${registroExitoso}" th:text="${registroExitoso}"></div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input id="correo" name="correo" type="email" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button class="btn btn-pelimatch w-100" type="submit">Ingresar</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">¿Aún no tienes cuenta?
        <a th:href="@{/registro}" class="auth-link">Crear cuenta</a>
    </p>
</main>
</body>
</html>
