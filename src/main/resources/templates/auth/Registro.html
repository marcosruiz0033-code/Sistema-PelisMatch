<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta - PelisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/CSS/StyleDash.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="auth-brand" th:href="@{/login}"><i class="bi bi-film"></i> PelisMatch</a>
    <p class="text-uppercase small fw-semibold text-secondary mt-4 mb-2">Únete a PelisMatch</p>
    <h1 class="h3 fw-bold">Crear cuenta</h1>
    <p class="text-secondary">Regístrate para explorar películas y series.</p>
    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" class="form-control" autocomplete="name" required>
            <small class="text-danger" th:errors="*{nombre}"></small>
        </div>
        <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input id="correo" type="email" th:field="*{correo}" class="form-control" autocomplete="email" required>
            <small class="text-danger" th:errors="*{correo}"></small>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" type="password" th:field="*{password}" class="form-control" autocomplete="new-password" required>
            <small class="text-danger" th:errors="*{password}"></small>
        </div>
        <button class="btn btn-pelimatch w-100" type="submit">Crear cuenta</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">¿Ya tienes cuenta?
        <a th:href="@{/login}" class="auth-link">Iniciar sesión</a>
    </p>
</main>
</body>
</html>
