<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de película - PelisMatch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f4f5f9;
            color: #222;
        }

        .contenedor {
            max-width: 600px;
            margin: 0 auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .error {
            display: block;
            margin-top: 5px;
            color: #c62828;
            font-size: 14px;
        }

        .acciones {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .boton {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
        }

        .guardar {
            flex: 1;
            background: #6c3ce9;
            color: white;
        }

        .cancelar {
            background: #e5e7eb;
            color: #222;
        }
    </style>
</head>

<body>
<div class="contenedor">

    <h1 th:text="${pelicula.id == null
        ? 'Agregar película'
        : 'Editar película'}">
        Película
    </h1>

    <form th:action="@{/admin/peliculas/guardar}"
          th:object="${pelicula}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="titulo">Título</label>
            <input id="titulo"
                   type="text"
                   th:field="*{titulo}"
                   required>

            <span class="error"
                  th:if="${#fields.hasErrors('titulo')}"
                  th:errors="*{titulo}"></span>
        </div>

        <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" th:field="*{categoria}" required>
                <option value="" disabled>Selecciona una categoría</option>
                <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="director">Director</label>
            <input id="director"
                   type="text"
                   th:field="*{director}">
        </div>

        <div class="campo">
            <label for="anio">Año</label>
            <input id="anio"
                   type="number"
                   th:field="*{anio}"
                   required>

            <span class="error"
                  th:if="${#fields.hasErrors('anio')}"
                  th:errors="*{anio}"></span>
        </div>

        <div class="campo">
            <label for="duracion">Duración (minutos)</label>
            <input id="duracion"
                   type="number"
                   th:field="*{duracion}">
        </div>

        <div class="campo">
            <label for="imagen">URL de imagen</label>
            <input id="imagen"
                   type="text"
                   th:field="*{imagen}">
        </div>

        <div class="campo">
            <label for="sinopsis">Sinopsis</label>
            <textarea id="sinopsis"
                      th:field="*{sinopsis}"
                      required></textarea>

            <span class="error"
                  th:if="${#fields.hasErrors('sinopsis')}"
                  th:errors="*{sinopsis}"></span>
        </div>

        <div class="campo">
            <label for="urlTrailer">URL del tráiler (YouTube)</label>
            <input id="urlTrailer"
                   type="text"
                   th:field="*{urlTrailer}">
        </div>



        <div class="acciones">
            <button class="boton guardar" type="submit">
                Guardar película
            </button>

            <a class="boton cancelar"
               th:href="@{/admin/peliculas}">
                Cancelar
            </a>
        </div>

    </form>
</div>
</body>
</html>
