<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Cabecera: logo, menú de géneros y buscador -->
<header th:fragment="cabecera" class="nav">
    <div class="nav-in">
        <a class="logo" th:href="@{/peliculas}">
            <svg viewBox="0 0 64 48" width="40" height="30" aria-hidden="true">
                <circle cx="14" cy="10" r="8" fill="currentColor"/>
                <circle cx="32" cy="10" r="8" fill="currentColor"/>
                <rect x="2" y="20" width="36" height="26" rx="5" fill="currentColor"/>
                <path d="M42 28l18-9v26l-18-9z" fill="currentColor"/>
            </svg>
            <span>Pelis<b>Match</b></span>
        </a>

        <nav class="links" aria-label="Principal">
            <a th:href="@{/peliculas}">Inicio</a>
            <div class="dropdown">
                <a href="#" class="drop-btn">Género ▾</a>
                <ul>
                    <li th:each="g : ${generos}">
                        <a th:href="@{/peliculas(genero=${g})}" th:text="${g}">Acción</a>
                    </li>
                </ul>
            </div>
        </nav>

        <form class="search" th:action="@{/peliculas}" method="get" role="search">
            <input type="search" name="q" th:value="${q}" placeholder="Buscar película…" aria-label="Buscar película">
            <button type="submit" aria-label="Buscar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
                </svg>
            </button>
        </form>
    </div>
</header>

<footer th:fragment="pie" class="foot">
    <p>PelisMatch · Módulo de información de películas</p>
</footer>

</body>
</html>
