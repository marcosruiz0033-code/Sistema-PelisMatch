<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PelisMatch - Películas</title>
   <link rel="stylesheet" th:href="@{/CSS/peliculas.css}">
</head>
<body>

<header class="nav">
    <a class="logo" th:href="@{/peliculas}"><span class="logo-mark"></span>Pelis<b>Match</b></a>
    <nav>
        <a th:href="@{/peliculas}" class="active">Películas</a>
        <a th:href="@{/peliculas/nueva}">Agregar película</a>
    </nav>
</header>

<main>
    <!-- Destacada: la primera película de la lista -->
    <section class="hero" th:if="${!peliculas.isEmpty()}" th:with="d=${peliculas[0]}"
             th:style="|--hue: ${d.id * 47 % 360}|">
        <div class="hero-info">
            <h1 th:text="${d.titulo}">Título</h1>
            <p class="meta">
                <span class="badge" th:text="${d.genero}">Género</span>
                <span th:text="${d.anio}">2025</span>
                <span th:text="${d.director}">Director</span>
            </p>
            <p class="desc" th:text="${d.descripcion}">Descripción</p>
            <div class="actions">
                <a class="btn btn-primary" href="#todas">▶ Ver ahora</a>
                <a class="btn" href="#">＋ Mis favoritos</a>
            </div>
        </div>
    </section>

    <section class="empty" th:if="${peliculas.isEmpty()}">
        <h2>Aún no hay películas</h2>
        <p>Agrega la primera para armar tu catálogo.</p>
        <a class="btn btn-primary" th:href="@{/peliculas/nueva}">Agregar película</a>
    </section>

    <!-- Top con números grandes -->
    <section class="row" th:if="${!peliculas.isEmpty()}">
        <h2>Top películas del día</h2>
        <div class="top">
            <article class="top-item" th:each="p, st : ${peliculas}" th:if="${st.index < 8}">
                <span class="rank" th:text="${st.count}">1</span>
                <div class="poster" th:style="|--hue: ${p.id * 47 % 360}|">
                    <span th:text="${p.titulo}">Título</span>
                </div>
            </article>
        </div>
    </section>

    <!-- Todas -->
    <section class="row" id="todas" th:if="${!peliculas.isEmpty()}">
        <div class="row-head">
            <h2>Películas</h2>
            <a class="btn btn-primary" th:href="@{/peliculas/nueva}">＋ Nueva película</a>
        </div>
        <div class="grid">
            <article class="card" th:each="p : ${peliculas}">
                <div class="poster" th:style="|--hue: ${p.id * 47 % 360}|">
                    <span th:text="${p.titulo}">Título</span>
                </div>
                <div class="card-body">
                    <h3 th:text="${p.titulo}">Título</h3>
                    <p class="sub"><span th:text="${p.genero}">Género</span> · <span th:text="${p.anio}">2025</span></p>
                    <div class="card-actions">
                        <a th:href="@{/peliculas/editar/{id}(id=${p.id})}">Editar</a>
                        <form th:action="@{/peliculas/eliminar/{id}(id=${p.id})}" method="post">
                            <button type="submit" class="link-danger">Eliminar</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>

</body>
</html>
