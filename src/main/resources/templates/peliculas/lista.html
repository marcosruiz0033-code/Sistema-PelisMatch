<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PelisMatch - Películas</title>
    <link rel="stylesheet" th:href="@{/CSS/peliculas.css}">
</head>
<body>

<div th:replace="~{peliculas/fragmentos :: cabecera}"></div>

<main class="wrap layout">

    <section class="main-col">
        <h1 class="titulo"
            th:text="${generoActual != null and !generoActual.isBlank()} ? ${generoActual}
                     : (${q != null and !q.isBlank()} ? |Resultados para “${q}”| : 'Películas')">Películas</h1>

        <div class="empty" th:if="${peliculas.isEmpty()}">
            <h2>No encontramos películas</h2>
            <p>Prueba con otro título o elige otro género.</p>
            <a class="btn" th:href="@{/peliculas}">Ver todas</a>
        </div>

        <div class="grid" th:unless="${peliculas.isEmpty()}">
            <a class="card" th:each="p : ${peliculas}" th:href="@{/peliculas/{id}(id=${p.id})}">
                <div class="poster" th:style="|--hue: ${p.id * 47 % 360}|">
                    <img th:if="${p.posterUrl != null and !p.posterUrl.isBlank()}"
                         th:src="${p.posterUrl}" th:alt="${p.titulo}" loading="lazy">
                    <span class="ph" th:unless="${p.posterUrl != null and !p.posterUrl.isBlank()}"
                          th:text="${p.titulo}">Título</span>
                    <span class="year" th:text="${p.anio}">2026</span>

                    <!-- Ficha rápida al pasar el cursor -->
                    <div class="pop">
                        <strong th:text="${p.titulo}">Título</strong>
                        <p class="pop-meta">
                            <span class="rate" th:if="${p.puntuacion != null}"
                                  th:text="${#numbers.formatDecimal(p.puntuacion, 1, 'COMMA', 1, 'POINT')} + '/10'">8.5/10</span>
                            <span th:text="${p.anio}">2026</span>
                            <span th:if="${p.duracion != null}" th:text="${p.duracion} + ' min'">120 min</span>
                        </p>
                        <p class="pop-desc" th:text="${#strings.abbreviate(p.descripcion, 110)}">Descripción</p>
                    </div>
                </div>
                <h3 th:text="${p.titulo}">Título</h3>
            </a>
        </div>
    </section>

    <aside class="side" th:if="${!masValoradas.isEmpty()}">
        <h2 class="side-title">Más valoradas</h2>
        <a class="top" th:each="p, st : ${masValoradas}" th:href="@{/peliculas/{id}(id=${p.id})}">
            <div class="mini" th:style="|--hue: ${p.id * 47 % 360}|">
                <img th:if="${p.posterUrl != null and !p.posterUrl.isBlank()}"
                     th:src="${p.posterUrl}" th:alt="${p.titulo}" loading="lazy">
                <span class="rank" th:text="|#${st.count}|">#1</span>
            </div>
            <div class="top-info">
                <h3 th:text="${p.titulo}">Título</h3>
                <p>
                    <span class="rate" th:text="${#numbers.formatDecimal(p.puntuacion, 1, 'COMMA', 1, 'POINT')}">8.5</span><small>/10</small>
                    <span class="muted" th:text="${p.anio}">2026</span>
                </p>
            </div>
        </a>
    </aside>

</main>

<div th:replace="~{peliculas/fragmentos :: pie}"></div>
</body>
</html>
