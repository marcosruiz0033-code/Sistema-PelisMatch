<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{Fragments/UsuarioLayout :: base(~{::contenidoUsuario})}">
<head>
    <meta charset="UTF-8">
    <title>Películas — PeliMatch</title>
</head>
<body>
<div th:fragment="contenidoUsuario">

    <h1 class="pagina-titulo">Películas</h1>

    <div class="grid-tarjetas" th:if="${!peliculas.isEmpty()}">
        <article class="tarjeta" th:each="p : ${peliculas}">
            <div class="poster-placeholder">
                <i class="bi bi-film"></i>
            </div>
            <div class="card-body">
                <p class="titulo" th:text="${p.titulo}">Título</p>
                <p class="meta">
                    <span th:text="${p.genero}">Género</span> ·
                    <span th:text="${p.anio}">2025</span>
                </p>
                <p class="meta" th:text="${p.director}">Director</p>
            </div>
        </article>
    </div>

    <section class="seccion" th:if="${peliculas.isEmpty()}">
        <div class="grid-tarjetas">
            <div class="tarjeta">
                <div class="poster-placeholder">
                    <i class="bi bi-film"></i>
                </div>
                <div class="card-body">
                    <p class="titulo">Sin películas</p>
                    <p class="meta">Agrega películas desde el panel admin</p>
                </div>
            </div>
        </div>
    </section>

</div>
</body>
</html>
