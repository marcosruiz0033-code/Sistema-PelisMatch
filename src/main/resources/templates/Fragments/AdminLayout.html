<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="base(contenidoAdmin)" >
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/CSS/StyleDash.css}"  >
    <title>Dashboard</title>
</head>
<body>
<!-- =========================
 CUERPO DEL DASHBOARD
========================= -->
<div class="container-fluid ">
    <div class="d-flex">
        <!-- =========================
             MENÚ LATERAL
        ========================== -->
        <aside class="sidebar p-3 d-flex flex-column vh-100">
            <h3 class="text-white text-center mb-4">
                <i class="bi bi-film fs-2 text-danger"></i>
                <span class="fs-5 fw-bold tracking-wide">PelisMatch</span>
            </h3>
            <nav class="flex-grow-1">
                <ul class="list-unstyled mb-0">
                    <li class="mb-2">
                        <a th:href="@{/admin/dashboard}"
                           class="nav-link text-dark rounded">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard
                        </a>
                    </li>

                    <li class="mb-2">
                        <a th:href="@{/admin/productos}"
                           class="nav-link text-dark rounded">
                            <i class="bi bi-camera-reels"></i>Peliculas
                        </a>
                    </li>

                    <li class="mb-2">
                        <a th:href="@{/admin/pedidos}"
                           class="nav-link text-dark rounded">
                            <i class="bi bi-tv"></i>Series
                        </a>
                    </li>

                    <li class="mb-2">
                        <a th:href="@{/admin/usuarios}"
                           class="nav-link text-dark rounded">
                            <i class="bi bi-people me-2"></i>Usuarios
                        </a>
                    </li>
                </ul>
                    <!-- Separación -->
                <div class="mt-auto pt-3 border-top border-secondary">
                    <a th:href="@{/logout}"
                       class="sidebar-logout-btn rounded">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Cerrar sesión
                    </a>
                </div>
            </nav>
        </aside>
        <!-- =========================
             CONTENIDO PRINCIPAL
        ========================== -->
        <div th:replace="${contenidoAdmin}">
            <p>hola mundo </p>
        </div>
    </div>
</div>
</body>
</html>
