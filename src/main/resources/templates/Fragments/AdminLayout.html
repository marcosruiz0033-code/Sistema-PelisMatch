<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="base(contenidoAdmin)" >
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/CSS/StyleDash.css}"  >
    <title>Dashboard</title>
</head>
<body>
<!-- Barra superior -->
<nav class="navbar bg-white border-bottom px-4">
    <!-- Izquierda -->
    <div class="d-flex align-items-center">
                <span class="text-secondary">
                    Bienvenido
                </span>
    </div>

    <!-- Centro -->
    <div class="position-absolute start-50 translate-middle-x">
                <span class="fs-4 fw-bold">
                    <i class="bi bi-film"></i>
                    PeliMatch
                </span>
    </div>

    <!-- Derecha -->
    <div class="d-flex align-items-center gap-2 ms-auto">
        <i class="bi bi-person-circle fs-4"></i>
        <span class="fw-semibold">
                    Juan Pérez
                </span>
    </div>
</nav>

<!-- =========================
 CUERPO DEL DASHBOARD
========================= -->
<div class="container-fluid">
    <div class="row min-vh-100">
        <!-- =========================
             MENÚ LATERAL
        ========================== -->
        <aside class="col-md-3 col-lg-2 bg-white border-end p-3">
            <nav class="nav flex-column gap-2">
                <a th:href="@{/admin/dashboard}"
                   class="nav-link text-dark rounded">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>

                <a th:href="@{/admin/productos}"
                   class="nav-link text-dark rounded">
                    <i class="bi bi-box-seam me-2"></i>Productos
                </a>


                <a th:href="@{/admin/pedidos}"
                   class="nav-link text-dark rounded">
                    <i class="bi bi-cart-check me-2"></i>Pedidos
                </a>


                <a th:href="@{/admin/usuarios}"
                   class="nav-link text-dark rounded">
                    <i class="bi bi-people me-2"></i>Usuarios
                </a>

                <!-- Separación -->
                <div class="mt-4 pt-3 border-top">

                    <a th:href="@{/logout}"
                       class="nav-link text-danger rounded">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Cerrar sesión
                    </a>
                </div>
            </nav>
        </aside>
        <!-- =========================
             CONTENIDO PRINCIPAL
        ========================== -->
        <div th:replace="${contenidoAdmin}">
            <p>hola mundo </p>
        </div>
    </div>
</div>
</body>
</html>
